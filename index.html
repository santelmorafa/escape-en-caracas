<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- Nunca cachear el HTML de entrada: en cada carga se pide fresco y así el
         teléfono siempre recibe la última versión (los JS/CSS llevan hash). -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Escape en Caracas</title>
    <link rel="stylesheet" href="/src/hud/hud.css" />
  </head>
  <body>
    <!-- Canvas de render -->
    <div id="game-root"></div>

    <!-- Overlay de carga -->
    <div id="loading-screen">
      <div class="loading-inner">
        <h1>ESCAPE EN CARACAS</h1>
        <p class="tagline">Corre por la ciudad. No mires atrás.</p>
        <div class="loading-bar"><div class="loading-bar-fill" id="loading-bar-fill"></div></div>
        <p class="loading-status" id="loading-status">Cargando…</p>
      </div>
    </div>

    <!-- HUD (lo puebla src/hud/HUD.js) -->
    <div id="hud"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
